<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una invitación especial 💌</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
          rel="stylesheet">
</head>

<body class="inicio">

    <main class="inicio-container">

        <p class="mini-text">
            TIENES UNA INVITACIÓN ESPECIAL
        </p>

        <h1>
            Hay momentos que<br>
            merecen celebrarse
        </h1>

        <p class="instruccion">
            Toca el sobre para descubrir la invitación
        </p>


        <!-- SOBRE -->
        <div class="envelope-container"
             onclick="abrirSobre()">
             


            <div class="envelope" id="envelope">

                <!-- CARTA -->
                <div class="letter">

                    <span class="flor">✿</span>

                    <p>Estás invitado al</p>

                    <h2>
                        Cumpleaños<br>
                        de Mamá
                    </h2>

                    <span class="fecha">
                        24 • 10 • 2026
                    </span>

                </div>


                <!-- PARTE TRASERA -->
                <div class="envelope-back"></div>


                <!-- LADOS DEL SOBRE -->
                <div class="envelope-left"></div>

                <div class="envelope-right"></div>

                <div class="envelope-bottom"></div>


                <!-- TAPA -->
                <div class="envelope-flap"></div>


                <!-- SELLO -->
                <div class="seal">
                    <span>♥</span>
                </div>

            </div>

        </div>


        <p class="click-text">
            
            <a href="invitacion.html" class="confirmar-button">
                Ir a invitacion
            <span>→</span>

             </a>

        </p>
     
    </main>


    <!-- TRANSICIÓN -->
    <div id="transition-screen">

        <span>✿</span>

        <h2>
            Una celebración<br>
            muy especial
        </h2>

    </div>


    <script src="script.js"></script>

</body>

</html>
